name: Android release

# Push a version tag (./scripts/release.sh --apk, or `git tag v1.2.0 && git push origin v1.2.0`)
# to build an APK for each app and attach all four to one GitHub Release you can download
# straight to a phone. "Run workflow" on the Actions tab builds them without a release
# (download them from the run). Free: GitHub Actions minutes are unlimited for public repositories.
#
# Optional repository secrets, to sign with your own release key:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APKs keep Expo's template debug signature, which is the same on every
# build, so a new release still installs over the old one. Switching to a release key later
# means uninstalling once.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        app: [patient, doctor, assistant, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      APP: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # One install at the root covers every workspace.
      - run: npm ci
        working-directory: .

      # The tag is the version people see; the run number keeps versionCode rising so
      # Android accepts each release as an update.
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p 'require("./app.json").expo.version')-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK=$GITHUB_WORKSPACE/health-${APP}-v${version}.apk" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            j.expo.version = process.env.VERSION;
            j.expo.android = { ...j.expo.android, versionCode: Number(process.env.GITHUB_RUN_NUMBER) };
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
          '

      # android/ is generated here and never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # arm64 covers current phones, armeabi-v7a older and budget ones.
      - name: Build APK
        working-directory: apps/${{ matrix.app }}/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk "$APK"

      - name: Sign with the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, keeping the debug signature"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS "$APK"
          "$apksigner" verify "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: health-${{ matrix.app }}-apk
          path: ${{ env.APK }}

  # A separate job so the four builds never race to create the same release.
  publish:
    name: Publish GitHub Release
    needs: apk
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: health-*-apk
          merge-multiple: true
          path: out

      - name: Write release notes
        run: |
          {
            echo "## Install on your phone"
            echo
            echo "1. Open this page on your Android phone and tap the APK for your app below (patient, doctor, assistant or admin)."
            echo "2. When asked, allow your browser to install unknown apps, then tap **Install**."
            echo "3. If Play Protect says the app is unrecognised, tap **Install anyway**."
            echo
          } > release-notes.md

      # The gh CLI is preinstalled on GitHub's runners; GITHUB_TOKEN is enough to publish.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/*.apk --title "Health platform ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md --generate-notes
          fi
